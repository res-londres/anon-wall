<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/style.css" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>AnonWall</title>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-container">
        <div class="loading-card">
            <div class="loading-spinner"></div>
        </div>
    </div>
    <!-- Sign Up Screen -->
    <div id="sign-up-container" style="display:none;">
        <div class="sign-up-card">
            <div class="card-left">
                <h1>AnonWall</h1>
                <p>Welcome!</p>
            </div>
            <div class="card-right">
                <h2>Sign up to AnonWall</h2>
                <p>Enter your private username</p>
                <input type="text" id="username-input" data-action="enterUsername" placeholder="Username" maxLength="20">
                <p id="invalid-username-message"></p>
                <button id="sign-up-button" data-action="signUp">Sign up</button>
            </div>
        </div>
    </div>
    <!-- Main Screen -->
     <main id="main-container" style="display: none;">
        <section class="header">
            <h1>AnonWall</h1>
        </section>
        <section class="left-sidebar">
            <nav>
                <a href="#" data-page="main-wall" data-action="fetchGlobalPosts" class="active">Main Wall</a>
                <a href="#" data-page="profile" data-action="fetchUserPosts">Profile</a>
                <a href="#" data-page="canvas" data-action="SOON">Canvas</a>
            </nav>
        </section>
        <section class="content">
            <div id="page-main-wall" class="page-content">
                <!-- Post Creator -->
                <div class="post-creator" id="post-creator">
                    <div class="post-creator-header">
                        <p class="post-creator-label">Create post</p>
                        <div class="post-creator-controls">
                            <select id="alt-name-select" class="alt-name-select">
                                <option value="{new-alt}">+ Create New Alt</option>
                            </select>
                            <button class="post-button" data-action="createPost">Post</button>
                        </div>
                    </div>
                    <div class="post-creator-input">
                        <textarea type="text" id="post-subject-input" class="post-subject-input" data-action="enterSubject" placeholder="Subject" rows="1" maxlength="150"></textarea>
                        <textarea type="text" id="post-content-input" class="post-content-input" data-action="enterContent" placeholder="Write something.." rows="1" maxlength="2000"></textarea>
                    </div>
                </div>

                <!-- Wall -->
                <div id="wall">
                    <!-- posts will be provided by js -->
                </div>
            </div>
            <div id="page-profile" class="page-content" style="display:none;">
                <div id="profile-header" class="profile-header">
                    <div class="profile-username">
                        <button id="show-private-username-button" class="show-private-username-button" data-action="showPrivateUsername">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                        <span id="private-username" class="private-username hidden">[HIDDEN USERNAME]</span>
                    </div>
                    <button class="copy-user-id-button" data-action="copyUserID">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>

                <div id="user-wall">
                    <!-- all user posts -->
                </div>
            </div>
            <div id="page-canvas" class="page-content" style="display:none;">
                canvas page
                <!-- TEST: REMOVE THIS -->
                <button onclick="cookieHelp.deleteCookie('user_id')">Magic Button</button> 
            </div>
        </section>
        <section class="right-sidebar">
            hello
        </section>
    </main>
    <!-- Post Detail Modal -->
    <div id="post-modal" class="post-modal" style="display:none;">
        <div class="post-modal-overlay" data-action="closePostModal"></div>
        <div class="post-modal-content">
            <div id="post-detail-content">
                <!-- post detail here -->
            </div>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module" src="static/script.js"></script>
</body>
</html>
